<!doctype html>

<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>刀帳</title>

    <style>
      :root{
        --bg:#f4efe6;--g1:rgba(31,181,174,.16);--g2:rgba(228,138,176,.17);--hd:#fbf8f1;--card:rgba(255,255,255,.76);--ink:#26304a;--sub:#6c7388;--line:rgba(47,74,160,.15);--navy:#2f4aa0;--ac2:#1fb5ae;--gold:#b8913a;--on:#fff;--chip:rgba(47,74,160,.08);--ok:#2f9a74;--sh:0 1px 0 rgba(255,255,255,.8) inset,0 8px 24px rgba(47,74,160,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
      @media (prefers-color-scheme:dark){
        :root:not([data-theme="light"]){--bg:#0a0f1f;--g1:rgba(88,227,216,.10);--g2:rgba(228,138,176,.09);--hd:#0d1328;--card:rgba(26,36,68,.66);--ink:#e8edff;--sub:#9aa7cc;--line:rgba(140,170,255,.2);--navy:#93b2ff;--ac2:#58e3d8;--gold:#e3c274;--on:#0a1022;--chip:rgba(147,178,255,.12);--ok:#5fd0a0;--sh:0 1px 0 rgba(147,178,255,.10) inset,0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
        :root[data-theme="dark"]{--bg:#0a0f1f;--g1:rgba(88,227,216,.10);--g2:rgba(228,138,176,.09);--hd:#0d1328;--card:rgba(26,36,68,.66);--ink:#e8edff;--sub:#9aa7cc;--line:rgba(140,170,255,.2);--navy:#93b2ff;--ac2:#58e3d8;--gold:#e3c274;--on:#0a1022;--chip:rgba(147,178,255,.12);--ok:#5fd0a0;--sh:0 1px 0 rgba(147,178,255,.10) inset,0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
      html{
        height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
      body{
        margin:0;min-height:100%;color:var(--ink);font:15px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:radial-gradient(700px 420px at 0% 0%,var(--g1),transparent 70%),radial-gradient(700px 480px at 100% 100%,var(--g2),transparent 70%),var(--bg);background-attachment:fixed}
        body::before{
        content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
      h2,.big,.ttl span,.hy,.hmd,.hwd{
        font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
      header{
        position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);border-bottom:1px solid var(--line)}
      .ttl{
        display:flex;align-items:baseline;gap:10px;padding:13px 18px 10px;background:repeating-radial-gradient(circle at 50% 100%,transparent 0 5px,var(--line) 5px 6px) 0 0/30px 15px,repeating-radial-gradient(circle at 50% 100%,transparent 0 5px,var(--line) 5px 6px) 15px 7px/30px 15px;-webkit-mask-image:linear-gradient(90deg,#000 0,transparent 85%);mask-image:linear-gradient(90deg,#000 0,transparent 85%)}
        .ttl::before{
          content:"";width:9px;height:9px;align-self:center;transform:rotate(45deg);background:linear-gradient(135deg,var(--ac2),var(--navy));box-shadow:0 0 10px var(--ac2)}
        .ttl span{
        font-size:21px;letter-spacing:.35em;color:var(--ink)}.ttl small{font-size:10px;letter-spacing:.4em;color:var(--ac2)}
      #pv_ver{position:absolute;right:18px;top:70%;transform:translateY(-50%);font-size:8px;letter-spacing:.08em;color:var(--sub);opacity:.5;cursor:pointer;padding:6px 4px}
      main{padding:14px 12px 112px;max-width:640px;margin:0 auto}
      section{
        display:none}
        section.on{
          display:block}
      .card{
        background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
      h2{
        font-size:13px;font-weight:600;letter-spacing:.22em;margin:20px 4px 9px;color:var(--sub);display:flex;align-items:center;gap:8px}
        h2::before{
          content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--ac2)}
        h2::after{
          content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
      .big{
        font-size:20px;font-weight:700;letter-spacing:.06em}
      .sub{
        color:var(--sub);font-size:13px}
      .row{
        display:flex;gap:8px;margin-bottom:8px}
        .row>*{flex:1;min-width:0}
      input,select,.btn{
        font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
        .btn{
          width:auto;flex:none;cursor:pointer}
      .chips{
        display:flex;gap:7px;overflow-x:auto;margin-bottom:10px;padding:2px 1px 4px}
        .chip{
          flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;letter-spacing:.04em}
        .chip.on{
        background:linear-gradient(135deg,var(--navy),var(--ac2));color:var(--on);border-color:transparent;box-shadow:0 3px 12px rgba(31,181,174,.35)}
      .it{
        display:flex;gap:13px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
        .it:last-child{border:0}
        .it .m{
        flex:1;min-width:0}
        .it b{
          display:block;font-size:16px;letter-spacing:.03em}
      .ic{
        flex:none;width:46px;height:46px;border-radius:16px 6px 16px 6px;display:grid;place-items:center;color:#fff;font:700 19px "Hiragino Mincho ProN","Yu Mincho",serif;background:linear-gradient(135deg,hsl(var(--h,220) 45% 58%),hsl(calc(var(--h,220) + 40) 50% 36%));box-shadow:0 0 0 2px var(--hd),0 0 0 3px var(--gold)}
      .bd{
          display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:38%}
      .lv{
        font:600 12px/1 -apple-system,"Hiragino Sans",sans-serif;color:var(--navy);margin-left:8px;letter-spacing:.04em;white-space:nowrap}.lv i{font-style:normal;color:var(--gold);margin-left:7px}
      .b{
        font-size:11px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--navy);border:1px solid var(--line);white-space:nowrap}
        .b.g{color:var(--ok)}
        .b.o{color:#6d4f0e;background:linear-gradient(135deg,#f6e7b8,#e4c473);border-color:transparent}
      .ev{
        border-left:3px solid var(--navy);padding:7px 11px;margin:7px 0;background:var(--chip);border-radius:10px}
        .ev small{color:var(--sub)}
      .wd,.nums,.dots,.bars{
        display:grid;grid-template-columns:repeat(7,1fr)}
        .wd{
          text-align:center;font-size:12px;color:var(--sub);letter-spacing:.1em;padding-bottom:4px}
      .wk{
        border-top:1px solid var(--line);padding:3px 0 5px;cursor:pointer;touch-action:manipulation}
      #calb{overflow:hidden}
      #calg{will-change:transform,opacity}
      #t2 .ym{flex:2;display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:18px;font-weight:700;letter-spacing:.08em;cursor:pointer}
      #t2 .ym::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--ac2);box-shadow:0 0 8px var(--ac2)}
      #t2 .ym small{font-size:11px;color:var(--ac2)}
      .yp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
      .yp-grid .chip{text-align:center;padding:9px 4px;border-radius:14px}
      .nums{
        text-align:center}
        .nums span{
          display:block;width:26px;height:26px;line-height:26px;margin:1px auto;border-radius:50%;font-size:13px}
        .nums .t{
          box-shadow:inset 0 0 0 1.5px var(--ac2)}
        .nums .s{
          background:linear-gradient(135deg,var(--navy),var(--ac2));color:var(--on);box-shadow:0 2px 8px rgba(31,181,174,.4)}
        .nums .x{
          opacity:.35}
      .bars{
        gap:2px 0}
        .bar{height:17px;line-height:17px;margin:0 1px;padding:0 6px;font-size:10.5px;color:#fff;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:9px}
        .bar.cl{
          border-top-left-radius:2px;border-bottom-left-radius:2px;margin-left:0}
        .bar.cr{
          border-top-right-radius:2px;border-bottom-right-radius:2px;margin-right:0}
      .dots span{
        display:flex;gap:2px;justify-content:center;height:8px;margin-top:3px}
      .dots i{
        width:6px;height:6px;border-radius:50%}
      .more{
        font-size:10px;color:var(--sub);text-align:right;padding-right:6px}
      .bar{
        box-shadow:0 1px 4px rgba(0,0,0,.18)}
      .lg{
        display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 3px 10px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
      .bar2{
        height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
        .bar2 i{
          display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--ac2));box-shadow:0 0 10px var(--ac2)}
      #sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
        #sheet.on{display:flex}
      #sb{background:var(--hd);color:var(--ink);width:min(92vw,420px);max-height:82vh;overflow-y:auto;border-radius:22px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.22);border:1px solid var(--line)}
      #sb table{width:100%;border-collapse:collapse;font-size:12px}
      #sb th,#sb td{padding:6px 4px;border-bottom:1px solid var(--line)}
      #sb th{color:var(--sub);font-weight:600;text-align:left}
      #sb td{color:var(--ink)}
      #sb .kv,#sb dl,#sb ul{font-size:12px;line-height:1.5}
      #sb .kv>div,#sb dl>div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
      #sb .kv span:first-child,#sb dt{color:var(--sub);font-weight:600;white-space:nowrap}
      #sb .kv span:last-child,#sb dd{color:var(--ink);margin:0;text-align:right}

      .xbtn{background:transparent!important;border:none!important;width:28px!important;min-width:28px!important;max-width:28px!important;height:28px!important;min-height:28px!important;aspect-ratio:1/1;padding:0!important;font-size:16px;line-height:1;color:#666;cursor:pointer;border-radius:6px;display:inline-flex!important;align-items:center;justify-content:center;flex:0 0 28px!important}
      .xbtn:hover{background:#f0f0f0;color:#111}
      table{
        width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}th{color:var(--sub);font-weight:600;letter-spacing:.1em;font-size:12px}
      #dock{
        position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(94%,460px);display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh),0 10px 30px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);z-index:15}
        #dock button{
          flex:1;border:0;background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:20px;font:inherit;font-size:10.5px;letter-spacing:.06em;white-space:nowrap}
        #dock svg{
          width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
        #dock button.on{
          color:var(--on);background:linear-gradient(135deg,var(--navy),var(--ac2));box-shadow:0 3px 12px rgba(31,181,174,.35)}
      .hero{
        display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
      .hdbox{
        display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px}
      .hy{
        font-size:12px;letter-spacing:.2em;color:var(--ink);opacity:.75;font-weight:600}
      .hmd{
        font-size:24px;font-weight:700;letter-spacing:.1em;line-height:1.3;color:var(--ink)}
      .hwd{
        align-self:stretch;margin-top:4px;padding-top:5px;border-top:1px solid var(--gold);font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--ink)}
      .hsekki{
        writing-mode:vertical-rl;font:700 16px/1.2 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.28em;color:var(--ink);opacity:.82;padding:4px 8px;border-left:1px solid var(--line)}
      .hm{
        flex:1}
      .hst{
        display:flex;gap:6px}
        .hst div{
          flex:1;text-align:center;background:var(--chip);border-radius:12px;padding:7px 2px}
        .hst b{
          display:block;font:700 22px/1.1 "Hiragino Mincho ProN","Yu Mincho",serif;color:var(--navy)}
        .hst span{
          font-size:10.5px;color:var(--sub);letter-spacing:.04em}
      .kv{
        display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
        .kv span:first-child{color:var(--sub);flex:none}
        .kv span:last-child{text-align:right}
      .seg{
        display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0 8px}
        .seg .sub{margin-right:2px}
      .tool{
        display:flex;gap:14px;align-items:center;cursor:pointer}
        .tool.soon{opacity:.6;cursor:default}
        .tool .ti{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--chip);color:var(--navy)}
        .tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
        .tool b{display:block;font-size:16px}
      .dim .bar:not(.hl){opacity:.28}
      .bar.hl{opacity:1;position:relative;z-index:2;outline:2px solid var(--ink);outline-offset:1px;box-shadow:0 0 0 2px var(--card),0 0 12px var(--c)}
      .ev.hl{background:var(--card);outline:2px solid var(--navy);outline-offset:-1px}
      #evl{scroll-margin-top:72px;scroll-margin-bottom:100px}
    </style>
  </head>
  
  <body>
    <header>
      <div class="ttl">
        <span id="pt"></span>
        <small id="ps"></small>
      </div>
      <small id="pv_ver">v1.1.5</small>
    </header>
    
    <main>
      <section id="t0"></section>
      <section id="t1"></section>
      <section id="t2"></section>
      <section id="t3"></section>
      <section id="t4"></section>
    </main>
    
    <nav id="dock"></nav>
    <div id="sheet">
      <div id="sb"></div>
    </div>

      +'<h2>14日以内に開始</h2><div class="card">'+(soon.map(e=>evH(e).replace('<small style','<small>'+md(e.a)+'〜</small> <small style')).join('')||'<div class="sub">なし</div>')+'</div>'}
      
        /* 刀帳 */
      const DX={q:'',t:'',s:'',c:'all',k:'no',asc:true},hue=s=>{let h=0;for(const c of s||'')h=(h*31+c.charCodeAt(0))%360;return h};
      const opt=(a,l)=>'<option value="">'+l+'：すべて</option>'+[...new Set(a.filter(Boolean))].map(v=>'<option>'+esc(v)+'</option>').join('');
      const KEY={no:s=>s.no,name:s=>s.n,rare:s=>s.r,impl:s=>s.d||'',got:s=>s.got||'',exp:s=>s.g?s.g[2]:-1,hp:s=>+s.st[1][0]||-1,atk:s=>+s.st[1][1]||-1,spd:s=>+s.st[1][3]||-1};
      const CH=[['all','全員',s=>1],['own','所持',s=>s.own],['no','未所持',s=>!s.own],['sh','修行済',s=>s.sh],['wait','修行待ち',s=>s.wait],['nokx','極未実装',s=>s.nokx]];
      const lvT=s=>{const a=[];if(s.cf&&!s.sh)a.push(s.cf);if(s.g&&s.g[1])a.push('Lv'+s.g[1]);const r=s.g&&s.g[0]?'<i>乱舞'+s.g[0]+'</i>':'';return a.length||r?'<span class="lv">'+a.join(' ')+r+'</span>':''};
      function dexInit(){
        $('#t1').innerHTML='<div class="row"><input id="q" placeholder="名前で検索"><select id="k"><option value="no">刀帳番号順</option><option value="name">名前順</option><option value="rare">レア度順</option><option value="impl">実装日順</option><option value="got">顕現日順</option><option value="exp">経験値順</option><option value="hp">生存（最大）順</option><option value="atk">打撃（最大）順</option><option value="spd">機動（最大）順</option></select><button class="btn" id="o">↑昇順</button></div><div class="row"><select id="ft">'+opt(SW.map(s=>s.t),'刀種')+'</select><select id="fs">'+opt(SW.map(s=>s.s),'刀派')+'</select></div><div class="chips" id="ch"></div><div class="card" style="padding:0" id="ls"></div>';
        $('#q').oninput=e=>{DX.q=e.target.value;dex()};$('#k').onchange=e=>{DX.k=e.target.value;dex()};$('#ft').onchange=e=>{DX.t=e.target.value;dex()};$('#fs').onchange=e=>{DX.s=e.target.value;dex()};
        $('#o').onclick=()=>{DX.asc=!DX.asc;$('#o').textContent=DX.asc?'↑昇順':'↓降順';dex()};$('#ch').onclick=e=>{if(e.target.dataset.c){DX.c=e.target.dataset.c;dex()}};
        $('#ls').onclick=e=>{const it=e.target.closest('.it');if(it)sheet(+it.dataset.i)};dex()}
      function dex(){
        const f=CH.find(c=>c[0]==DX.c)[2],q=DX.q.trim();

        let a=SW.map((s,i)=>[s,i]).filter(x=>f(x[0])&&(!q||x[0].n.includes(q))&&(!DX.t||x[0].t==DX.t)&&(!DX.s||x[0].s==DX.s));
        const kf=KEY[DX.k];a.sort((x,y)=>{const p=kf(x[0]),r=kf(y[0]);return (typeof p=='string'?p.localeCompare(r,'ja'):p-r)*(DX.asc?1:-1)});
        $('#ls').innerHTML=a.map(([s,i])=>{const bd=[];if(s.sh)bd.push('<span class="b o">極</span>');else if(s.wait)bd.push('<span class="b">修行待ち</span>');else if(s.nokx)bd.push('<span class="b">極未実装</span>');
        s.tg.forEach(t=>bd.push('<span class="b g">'+esc(t)+'</span>'));
        return '<div class="it" data-i="'+i+'"><div class="ic" style="--h:'+hue(s.s||s.t)+'">'+esc(TK[s.t]||(s.t||'')[0]||'')+'</div><div class="m"><b>'+esc(s.n)+lvT(s)+'</b><span class="sub">No.'+s.no+' ・ '+(s.own?(s.got?fmt(s.got):'所持'):'未所持')+' ・ '+esc(s.t)+(s.r?' ★'+s.r:'')+'</span></div><div class="bd">'+bd.join('')+'</div></div>'}).join('')||'<div class="sub" style="padding:14px">該当なし</div>'}
      const forms=s=>[{k:'初',lv:1,st:s.st}].concat(s.fm||[],s.kxi?[{k:'極',st:s.kx.st}]:[]);
      function sheet(i,v){
        const s=SW[i],fs=forms(s),cur=v||(s.sh?'極':(s.cf||'初')),f=fs.find(x=>x.k==cur)||fs[0],isK=f.k=='極',g=s.g,lv=g&&g[1]!=null?g[1]:0;
        const kv=(a,b)=>b==null||b===''?'':'<div class="kv"><span>'+a+'</span><span>'+esc(b)+'</span></div>',D=x=>x?fmt(x):'';
        const gt=s.own?(s.got?fmt(s.got):'所持'):'未所持';
        const dates=s.kxi&&(s.sh||isK)?kv('初実装日',D(s.d))+kv('極実装日',D(s.kx.d))+kv('顕現日',gt)+kv('修行完了日',s.sh?(s.kg?fmt(s.kg):'修行済'):'未修行'):kv('実装日',D(s.d))+kv('顕現日',gt);
        const gr=g?kv('累積経験値',g[2]==null?'':g[2].toLocaleString())+(!s.sh&&s.kxi&&g[5]!=null?kv('極相当Lv',String(g[5]).startsWith('極')?g[5]:'極Lv'+g[5]):'')+(!s.sh&&s.kxi&&g[4]!=null?kv('修行目安Lv','極Lv'+g[4]):''):'';
        const tl=s.tl&&!s.sh?kv('特ランクアップLv',s.tl[0]&&lv<s.tl[0]?'Lv'+s.tl[0]:'')+kv('修行可能Lv',s.tl[1]&&lv<s.tl[1]?'Lv'+s.tl[1]:''):'';
        const stB=s.wait?' <span class="b">修行待ち</span>':(s.nokx?' <span class="b">極未実装</span>':'');
                $('#sb').innerHTML='<div class="row" style="align-items:center"><div class="big">'+esc(s.n)+lvT(s)+'</div><button class="xbtn" id="cl" aria-label="閉じる">×</button></div>'
        +'<div class="sub">No.'+s.no+' ・ '+esc([s.t,s.s].filter(Boolean).join('・'))+(s.r?' ・ ★'+s.r:'')+(s.sl?' ・ 刀装'+s.sl:'')+stB+'</div>'
        +(fs.length>1?'<div class="seg"><span class="sub">ステータスを見る</span>'+fs.map(x=>'<button class="chip'+(x.k==f.k?' on':'')+'" data-k="'+x.k+'">'+x.k+'</button>').join('')+'</div>':'')
        +dates+gr+tl
        +'<table style="margin:14px 0 16px"><tr><th></th><th>初期</th><th>現在</th><th>最大</th><th>乱舞9</th><th>乱舞10</th></tr>'+STN.map((n,j)=>{const curSt=(g&&g[6]&&isK===!!s.sh)?g[6][j]:null;return'<tr><td>'+n+'</td><td>'+(f.st[0][j]==null?'-':esc(f.st[0][j]))+'</td><td>'+(curSt==null?'-':esc(curSt))+'</td>'+[1,2,3].map(x=>'<td>'+(f.st[x]&&f.st[x][j]!=null?esc(f.st[x][j]):'-')+'</td>').join('')+'</tr>'}).join('')+'</table>'
        +Object.entries(s.get||{}).map(e=>kv(e[0],e[1])).join('');
        $('#sheet').classList.add('on');document.querySelectorAll('#sb [data-k]').forEach(b=>b.onclick=()=>sheet(i,b.dataset.k))}

      /* カレンダー */
      const evC=e=>'<div class="ev'+(e.id==CA.hl?' hl':'')+'" data-ev="'+e.id+'" style="border-color:'+LC[e.l]+'"><small style="color:'+LC[e.l]+'">'+LN[e.l]+'</small> '+esc(etl(e))+'<div class="sub">'+fmt(e.a)+(e.b&&e.b>e.a?' 〜 '+fmt(e.b):'')+'</div></div>';
      const nw=new Date(),CA={y:nw.getFullYear(),m:nw.getMonth(),sel:T,hl:null,tp:0,tk:''},MAXL=4,PR=[0,1,2,4,3,5,6];
      function ymPick(){
        const ys=Array.from({length:nw.getFullYear()-2014+3},(_,i)=>2014+i).map(y=>'<button class="chip'+(y==CA.y?' on':'')+'" data-py="'+y+'">'+y+'</button>').join('');
        const ms=Array.from({length:12},(_,i)=>'<button class="chip'+(i==CA.m?' on':'')+'" data-pm="'+i+'">'+(i+1)+'月</button>').join('');
        $('#sb').innerHTML='<div class="row" style="align-items:center"><div class="big">年月を選択</div><button class="xbtn" id="closeSet" data-close aria-label="閉じる">×</button></div>'
        +'<h2>年</h2><div class="yp-grid">'+ys+'</div><h2>月</h2><div class="yp-grid">'+ms+'</div>';
        $('#sheet').classList.add('on');
        document.querySelectorAll('#sb [data-py]').forEach(b=>b.onclick=()=>{CA.y=+b.dataset.py;ymPick();cal()});
        document.querySelectorAll('#sb [data-pm]').forEach(b=>b.onclick=()=>{CA.m=+b.dataset.pm;$('#sheet').classList.remove('on');cal()});
      }
      function slideCal(dir){
        const g=$('#calg');
        if(!g){CA.m+=dir;if(CA.m<0){CA.m=11;CA.y--}if(CA.m>11){CA.m=0;CA.y++}cal();return}
        g.style.transition='transform .11s ease-out,opacity .11s ease-out';
        g.style.transform='translateX('+(dir>0?-35:35)+'%)';g.style.opacity='0';
        setTimeout(()=>{
          CA.m+=dir;if(CA.m<0){CA.m=11;CA.y--}if(CA.m>11){CA.m=0;CA.y++}cal();
          const ng=$('#calg');
          if(ng){ng.style.transform='translateX('+(dir>0?35:-35)+'%)';ng.style.opacity='0';ng.offsetWidth;
          ng.style.transition='transform .14s cubic-bezier(.2,.8,.2,1),opacity .14s';ng.style.transform='';ng.style.opacity=''}
        },100);
      }
      function cal(go){const f=new Date(CA.y,CA.m,1),ws=new Date(f);ws.setDate(1-f.getDay());const lt=new Date(CA.y,CA.m+1,0),we=new Date(lt);we.setDate(lt.getDate()+(6-lt.getDay()));
      const nwk=Math.round((we-ws)/864e5+1)/7;let wk='';
      for(let w=0;w<nwk;w++){const d0=new Date(ws);d0.setDate(ws.getDate()+w*7);const ds=[0,1,2,3,4,5,6].map(i=>{const d=new Date(d0);d.setDate(d0.getDate()+i);return iso(d)});
        const nums=ds.map(k=>'<span class="'+(k==T?'t ':'')+(k==CA.sel?'s ':'')+(pd(k).getMonth()!=CA.m?'x':'')+'">'+pd(k).getDate()+'</span>').join('');
        const segs=EV.filter(e=>e.b&&e.b>e.a&&e.a<=ds[6]&&e.b>=ds[0]).map(e=>({e,s:Math.max(0,days(ds[0],e.a)),t:Math.min(6,days(ds[0],e.b)),cl:e.a<ds[0],cr:e.b>ds[6]})).sort((x,y)=>PR[x.e.l]-PR[y.e.l]||x.s-y.s||(y.t-y.s)-(x.t-x.s));
        const ln=[];let hid=0,bars='';
        segs.forEach(g=>{let r=ln.findIndex(x=>x.every(q=>g.t<q[0]||g.s>q[1]));if(r<0&&ln.length<MAXL){r=ln.length;ln.push([])}if(r<0){hid++;return}ln[r].push([g.s,g.t]);
        bars+='<div class="bar'+(g.cl?' cl':'')+(g.cr?' cr':'')+(g.e.id==CA.hl?' hl':'')+'" data-e="'+g.e.id+'" style="grid-column:'+(g.s+1)+'/'+(g.t+2)+';grid-row:'+(r+1)+';--c:'+LC[g.e.l]+'">'+esc(etl(g.e))+'</div>'});
        const dots=ds.map(k=>{const l=[...new Set((DM[k]||[]).filter(e=>!(e.b&&e.b>e.a)).map(e=>e.l).concat(annOn(k).map(e=>e.l)))].sort();return '<span>'+l.slice(0,4).map(x=>'<i style="background:'+LC[x]+'"></i>').join('')+'</span>'}).join('');
        wk+='<div class="wk" data-d="'+ds[0]+'"><div class="nums">'+nums+'</div>'+(ln.length?'<div class="bars" style="grid-template-rows:repeat('+ln.length+',17px)">'+bars+'</div>':'')+'<div class="dots">'+dots+'</div>'+(hid?'<div class="more">ほか'+hid+'件</div>':'')+'</div>'}
      const he=CA.hl!=null?EV[CA.hl]:null,ev=CA.sel?(DM[CA.sel]||[]).concat(annOn(CA.sel)).sort((x,y)=>x.l-y.l):[];
      const det=CA.sel?'<h2>'+md(CA.sel)+'（'+WD[pd(CA.sel).getDay()]+'）</h2><div class="card">'+(ev.map(evC).join('')||'<div class="sub">予定なし</div>')+'</div>':(he?'<h2>選択中の予定</h2><div class="card">'+evC(he)+'</div>':'');
      $('#t2').innerHTML='<div class="row" style="align-items:center"><button class="btn" id="pv">◀</button><button class="btn ym" id="ym">'+CA.y+'年 '+(CA.m+1)+'月<small>▾</small></button><button class="btn" id="nx">▶</button><button class="btn" id="td">今日</button></div><div class="card'+(CA.hl!=null?' dim':'')+'" id="calb" style="padding:10px 6px"><div id="calg"><div class="wd">'+[...'日月火水木金土'].map(x=>'<div>'+x+'</div>').join('')+'</div>'+wk+'</div></div><div class="lg">'+LN.map((x,i)=>'<span><i style="background:'+LC[i]+'"></i>'+x+'</span>').join('')+'</div><div id="evl">'+det+'</div>';
      $('#pv').onclick=()=>slideCal(-1);$('#nx').onclick=()=>slideCal(1);
      $('#ym').onclick=ymPick;
      $('#td').onclick=()=>{CA.y=nw.getFullYear();CA.m=nw.getMonth();CA.sel=T;CA.hl=null;cal()};if(go)$('#evl').scrollIntoView({behavior:'smooth',block:'nearest'})}
      let sx=0,sy=0,dr=0,wt=0;$('#t2').ontouchstart=e=>{if(e.target.closest('#calb')&&e.touches.length==1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;dr=0;const g=$('#calg');if(g)g.style.transition='none'}else sx=0};
      $('#t2').ontouchmove=e=>{if(!sx)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(!dr&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2)dr=1;if(dr){e.preventDefault();const g=$('#calg');if(g){g.style.transform='translateX('+dx+'px)';g.style.opacity=Math.max(.35,1-Math.abs(dx)/280)}}};
      $('#t2').ontouchend=e=>{if(!sx)return;const dx=e.changedTouches[0].clientX-sx;sx=0;if(dr){dr=0;if(Math.abs(dx)>55)slideCal(dx<0?1:-1);else{const g=$('#calg');if(g){g.style.transition='transform .2s,opacity .2s';g.style.transform='';g.style.opacity=''}}}};
      $('#t2').onwheel=e=>{if(!e.target.closest('#calb'))return;if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>18){e.preventDefault();const now=Date.now();if(now-wt>260){wt=now;slideCal(e.deltaX>0?1:-1)}}};
      $('#t2').onclick=e=>{const now=Date.now(),li=e.target.closest('[data-ev]');if(li){const id=+li.dataset.ev;CA.hl=CA.hl===id?null:id;cal();return}
      const b=e.target.closest('.bar');if(b){const id=+b.dataset.e,k='b'+id,dbl=CA.tk===k&&now-CA.tp<350;CA.tp=now;CA.tk=k;if(dbl){$('#evl').scrollIntoView({behavior:'smooth',block:'nearest'});return}CA.sel=null;CA.hl=CA.hl===id?null:id;cal();return}
      const n=e.target.closest('.nums');if(n){const r=n.getBoundingClientRect(),c=Math.min(6,Math.max(0,Math.floor((e.clientX-r.left)/r.width*7))),d=pd(n.closest('.wk').dataset.d);
      d.setDate(d.getDate()+c);const s=iso(d),k='d'+s,dbl=CA.tk===k&&now-CA.tp<350;CA.tp=now;CA.tk=k;CA.sel=s;CA.hl=null;cal(dbl);return}
      if(!e.target.closest('button,select,#evl')&&(CA.hl!=null||CA.sel!=null)){CA.hl=null;CA.sel=null;cal()}};
      
      /* 回想 */
      const RC={f:'all',q:''},done=new Set(U.rc);
      function recInit(){const n=M.rec.length,d=M.rec.filter(r=>done.has(r[0])).length;
      $('#t3').innerHTML='<div class="card"><div class="big">'+d+' / '+n+'</div><div class="sub">回収率 '+Math.round(d/n*100)+'%</div><div class="bar2" style="margin-top:8px"><i style="width:'+d/n*100+'%"></i></div></div><input id="rq" placeholder="名前・刀剣男士・合戦場で検索" style="margin-bottom:8px"><div class="chips" id="rf"></div><div class="card" style="padding:0" id="rl"></div>';
      $('#rq').oninput=e=>{RC.q=e.target.value;rec()};$('#rf').onclick=e=>{if(e.target.dataset.f){RC.f=e.target.dataset.f;rec()}};rec()}
      function rec(){const q=RC.q.trim();$('#rf').innerHTML=[['all','すべて'],['no','未回収'],['yes','回収済']].map(c=>'<button class="chip'+(RC.f==c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('');
      $('#rl').innerHTML=M.rec.filter(r=>(RC.f=='all'||(RC.f=='yes')==done.has(r[0]))&&(!q||r.slice(1).join(' ').includes(q))).map(r=>'<div class="it" style="cursor:default"><div class="ic" style="background:'+(done.has(r[0])?'var(--ok)':'var(--sub)')+'">'+(done.has(r[0])?'✓':r[0])+'</div><div class="m"><b>'+esc(r[1]||'（未入力）')+'</b><span class="sub">#'+r[0]+(r[3]?' ・ '+esc(r[3]):'')+(r[4]?' ・ '+esc(r[4]):'')+'</span><div class="sub">'+esc(r[2]||'')+'</div></div></div>').join('')||'<div class="sub" style="padding:14px">該当なし</div>'}
     
      /* 道具：ここにシミュレーターやグラフを追加していく。TOOLS に {id,n,d,ic,render(el)} を足すだけ。render が無いものは「準備中」表示 */
      const TOOLS=[{id:'graph',n:'推移グラフ',d:'資源・経験値・審神者Lvの移り変わり',ic:'<path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/>'},{id:'sim',n:'シミュレーター',d:'錬結・鍛刀・遠征などの計算',ic:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/>'}],TL={cur:''};
      function tools(){const t=TOOLS.find(x=>x.id==TL.cur);if(t&&t.render){$('#t4').innerHTML='<div class="row"><button class="btn" id="tb">◀ 道具一覧</button></div><div id="tbody"></div>';$('#tb').onclick=()=>{TL.cur='';tools()};t.render($('#tbody'));return}
      $('#t4').innerHTML='<div class="card"><div class="sub">シミュレーターやグラフを、ここに足していきます。</div></div>'+TOOLS.map(x=>'<div class="card tool'+(x.render?'':' soon')+'" data-tool="'+x.id+'"><div class="ti"><svg viewBox="0 0 24 24">'+x.ic+'</svg></div><div><b>'+x.n+'</b><span class="sub">'+x.d+'</span></div>'+(x.render?'':'<span class="b" style="margin-left:auto">準備中</span>')+'</div>').join('')}
      $('#t4').onclick=e=>{const c=e.target.closest('[data-tool]');if(c){const t=TOOLS.find(x=>x.id==c.dataset.tool);if(t&&t.render){TL.cur=t.id;tools()}}};
      today();dexInit();cal();recInit();tools();show(0);

      // ポップアップ外・×ボタンで閉じる
      $('#sheet').onclick=e=>{if(e.target.id==='sheet'||e.target.closest('.xbtn'))$('#sheet').classList.remove('on')};

      // バージョン番号タップでキャッシュを無視して最新を再読み込み
      $('#pv_ver').onclick=()=>{const u=new URL(location.href);u.searchParams.set('t',Date.now());location.replace(u)};

    </script>
